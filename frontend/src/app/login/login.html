<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <h1>Beli for Vandy</h1>
      <p>Discover your next favorite spot.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>

        <input
          matInput
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your username"
          required
        />

        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        />

        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <button mat-flat-button type="submit" [disabled]="!username || !password || loggingIn">
        Log in
      </button>

      <p class="login-message" *ngIf="loginMessage" role="alert">{{ loginMessage }}</p>
    </form>

    <p class="signup-prompt">
      New to Beli for Vandy?
      <a routerLink="/register">Sign up</a>
    </p>
  </div>
</div>
