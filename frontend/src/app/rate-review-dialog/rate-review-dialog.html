<h2 mat-dialog-title>Rate {{ data.diningHallName }}</h2>

<mat-dialog-content>
  <div class="form">
    <!-- Rating -->
    <mat-form-field appearance="outline">
      <mat-label>Rating</mat-label>

      <input
        matInput
        type="number"
        min="1"
        max="10"
        step="0.1"
        [(ngModel)]="rating"
        placeholder="1–10"
      />

      <span matTextSuffix>/ 10</span>
    </mat-form-field>

    <!-- Meal type -->
    <mat-form-field appearance="outline">
      <mat-label>Meal</mat-label>

      <mat-select [(ngModel)]="mealType">
        <mat-option *ngFor="let meal of mealTypes" [value]="meal">
          {{ meal }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Review text -->
    <mat-form-field appearance="outline">
      <mat-label>Review</mat-label>

      <textarea
        matInput
        rows="5"
        [(ngModel)]="reviewText"
        placeholder="What did you think?"
      ></textarea>
    </mat-form-field>

    <!-- Photos -->
    <div class="photo-section">
      <div class="photo-heading">
        <div>
          <strong>Photos</strong>
          <span>Optional</span>
        </div>

        <label mat-stroked-button class="photo-upload-button">
          <mat-icon>add_photo_alternate</mat-icon>
          Add photos

          <input type="file" accept="image/*" multiple hidden (change)="onPhotosSelected($event)" />
        </label>
      </div>

      <!-- Photo previews -->
      <div class="photo-previews" *ngIf="photoPreviews.length > 0">
        <div class="photo-preview" *ngFor="let photo of photoPreviews; let i = index">
          <img [src]="photo.url" alt="Selected review photo" />

          <button
            mat-icon-button
            type="button"
            class="remove-photo"
            aria-label="Remove photo"
            (click)="removePhoto(i)"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>

  <button
    mat-flat-button
    (click)="submitReview()"
    [disabled]="rating === null || rating < 1 || rating > 10 || !mealType"
  >
    Submit review
  </button>
</mat-dialog-actions>
