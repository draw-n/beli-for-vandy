name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-gate:
    name: Security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned Python scanners
        run: python -m pip install --disable-pip-version-check semgrep==1.182.0 pip-audit==2.10.1

      - name: Run Semgrep SAST
        if: ${{ !cancelled() }}
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          set -euo pipefail
          semgrep scan \
            --config p/python \
            --config p/typescript \
            --metrics=off \
            --json \
            --exclude '*.spec.ts' \
            --exclude '**/tests/**' \
            --exclude '**/node_modules/**' \
            --exclude '**/.venv/**' \
            --exclude '**/dist/**' \
            --exclude '**/coverage/**' \
            --exclude '**/playwright-report/**' \
            backend/main.py backend/settings.py backend/database.py \
            backend/controllers backend/models backend/routes frontend/src \
            > "$RUNNER_TEMP/semgrep-results.json"
          python scripts/security/check_semgrep_results.py "$RUNNER_TEMP/semgrep-results.json"

      - name: Audit Python dependencies
        if: ${{ !cancelled() }}
        run: pip-audit --requirement backend/requirements-dev.txt --format=columns

      - name: Set up Node.js
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          package-manager-cache: false

      - name: Audit frontend dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm exec --yes --package=npm@11.7.0 -- npm audit --audit-level=high

      - name: Scan complete Git history for secrets
        if: ${{ !cancelled() }}
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
        with:
          args: git --redact=100 --log-opts=--all .

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REAL_MONGODB_URI: mongodb://localhost:27017/beli_integration_test

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Lint backend
        run: ruff check backend

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run backend unit tests
        run: >-
          python -m pytest
          backend/tests/test_user_models.py
          backend/tests/test_user_controller.py
          backend/tests/test_account_api.py

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run backend integration tests
        run: >-
          python -m pytest
          backend/tests/test_reviews.py
          backend/tests/test_locations.py
          backend/tests/test_follows.py
          backend/tests/test_personal_rankings.py

      - name: Run real MongoDB integration test
        run: python -m pytest backend/tests/test_review_real_database.py

      - name: Enforce backend coverage gate
        run: >-
          python -m pytest
          --cov=backend
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:backend/coverage.xml
          --cov-fail-under=70

      - name: Enforce frontend coverage gate
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend for production and integration tests
        working-directory: frontend
        env:
          API_BASE_URL: http://127.0.0.1:18000
        run: npm run build

      - name: Run Angular-FastAPI Playwright integration test
        working-directory: frontend
        env:
          PLAYWRIGHT_REUSE_BUILD: '1'
        run: npm run test:integration

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-artifacts
          path: frontend/tmp/playwright-results/
          if-no-files-found: ignore

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            backend/coverage.xml
            frontend/coverage/
          if-no-files-found: error

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality-gate, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@63.1.2

      - name: Pull backend staging configuration
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build backend staging deployment
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy backend to staging
        id: backend-deploy
        env:
          CORS_ORIGINS: '["${{ vars.STAGING_WEB_URL }}"]'
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --env MONGODB_URI="$STAGING_MONGODB_URI" \
            --env CORS_ORIGINS="$CORS_ORIGINS")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test backend deployment
        env:
          DEPLOYMENT_URL: ${{ steps.backend-deploy.outputs.url }}
        run: >-
          vercel curl "$DEPLOYMENT_URL/"
          --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 30

      - name: Pull frontend staging configuration
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build frontend staging deployment
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy frontend to staging
        id: frontend-deploy
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Smoke-test frontend deployment
        env:
          DEPLOYMENT_URL: ${{ steps.frontend-deploy.outputs.url }}
        run: >-
          vercel curl "$DEPLOYMENT_URL/"
          --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 30
